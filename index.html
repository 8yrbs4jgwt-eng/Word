<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ваше Имя — визитка</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #222;
    }
    .card {
      background: #fff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      max-width: 360px;
      width: calc(100% - 32px);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #555; line-height: 1.4; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    .links a {
      display: block;
      padding: 12px;
      border-radius: 8px;
      background: #f1f1f8;
      color: #4a3f9f;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .links a:hover { background: #e0defa; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ваше Имя</h1>
    <p>Я создаю удобные и красивые вещи для интернета.</p>
    <nav class="links">
      <a href="https://t.me/your_username" target="_blank" rel="noopener">Telegram</a>
      <a href="https://vk.com/your_username" target="_blank" rel="noopener">ВКонтакте</a>
      <a href="https://github.com/your_username" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </main>
</body>
</html>
